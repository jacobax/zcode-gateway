name: CI

# 每次推 main 或开 PR 都跑一遍：vet + test + 构建。
# 发布走 release.yml（推 v* tag 时编译六个平台并建 Release）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"

jobs:
  build:
    name: Vet / Test / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go build
        run: go build -trimpath -ldflags="-s -w" -o /tmp/zcode-gateway .
      - name: 检查前端资源
        run: |
          set -euo pipefail
          # 面板资源靠 ?v=N 绕过 CDN 缓存，改 web/ 必须 bump
          node --check web/app.js
          node --check web/login.js
          # 光查语法不够：少一个 } 会让后面的函数被吞进上一个函数体，
          # 顶层监听引用时 ReferenceError，整页白屏（右下角永远「连接中 v-」）。
          # 用 DOM 桩把 app.js 真跑一遍才抓得到这类错。
          node scripts/web-smoke.js web/app.js
      - name: 扫描凭据与私人信息
        run: bash scripts/scan-secrets.sh
